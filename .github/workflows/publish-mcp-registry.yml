# Publishes server.json (remote servers https://api-oiyo.861106.workers.dev/mcp, alias https://api.oiyo.net/mcp) to the official MCP Registry.
# The io.github.yuli3/* name is verified with GitHub OIDC, so no secret is needed.
# Runs when server.json changes on main (bump "version" together with tools-spec.mjs), or by hand.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
